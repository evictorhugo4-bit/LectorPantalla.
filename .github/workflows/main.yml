name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --no-daemon -Pandroid.useAndroidX=true

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: LectorPantalla-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
